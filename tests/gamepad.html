<body>
    <h1>No Controller Connected</h1>
</body>

<!-- see https://xtrp.io/blog/2020/12/15/how-to-use-the-html5-gamepad-api/ -->

<script type="text/javascript">
// global gamepad object
let gamepadIndex;
window.addEventListener('gamepadconnected', (event) => {
    gamepadIndex = event.gamepad.index;
});

setInterval(() => {
    if(gamepadIndex !== undefined) {
        const myGamepad = navigator.getGamepads()[gamepadIndex];
        const pressed = myGamepad.buttons
            .map((e, i) => e.pressed ? `<h1>Button ${i} is pressed</h1>` : '')
            .join('');
        document.body.innerHTML = pressed || '<h1>No buttons pressed</h1>';
    }
}, 100) // print buttons that are pressed 10 times per second
</script>
