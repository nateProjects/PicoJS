<!DOCTYPE html>

<head></head>
<body>

<div id="box">
    <input type="text">
</div>

<script>
let keysPressed = {};

document.addEventListener('keydown', (event) => {
   keysPressed[event.key] = true;

   if (keysPressed['Control'] && event.key == 'z') {
       alert(event.key);
   }
});

document.addEventListener('keyup', (event) => {
   delete keysPressed[event.key];
});

</script>
