<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>PicoDiver &mdash; ported to picoJS</title>
    <style>
        body {
            background: #1D2B53;
            color: #FFF1E8;
            font-family: ui-monospace, Menlo, monospace;
            margin: 16px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p  { font-size: 14px; margin: 0 0 12px; }
        code { color: #FF77A8; }
        canvas {
            position: static !important;
            left: auto !important;
            top: auto !important;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }
    </style>
</head>
<body>
    <h1>PicoDiver &mdash; picoJS port</h1>
    <p>
        Arrows move &middot; <kbd>X</kbd> easy mode from title &middot;
        <kbd>Z</kbd> arcade (hard) mode. 
        Ported from <code>picodiver2.p8</code>; sound (<code>sfx</code>) isn't
        implemented yet.
    </p>
    <script type="text/javascript" src="picoJS.js"></script>
    <script type="text/javascript" src="picodiver-data.js"></script>
    <script type="text/javascript" src="picodiver.js"></script>
</body>
</html>
