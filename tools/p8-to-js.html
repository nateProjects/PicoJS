<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>p8-to-js</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        background: #1D2B53;
        color: #FFF1E8;
        min-height: 100vh;
        padding: 40px 32px;
    }

    h1 { font-size: 1.4rem; margin-bottom: 6px; }
    p  { color: #83769C; margin-bottom: 32px; font-size: 0.9rem; }

    /* Drop zone */
    #dropzone {
        border: 2px dashed #83769C;
        border-radius: 6px;
        padding: 48px 32px;
        text-align: center;
        color: #83769C;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
        max-width: 560px;
    }
    #dropzone.over {
        border-color: #FFA300;
        color: #FFA300;
    }
    #dropzone label {
        cursor: pointer;
        color: #29ADFF;
        text-decoration: underline;
    }
    #dropzone input[type=file] {
        display: none;
    }

    /* Output */
    #output-section {
        margin-top: 32px;
        max-width: 760px;
    }
    #output-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    #output-name {
        color: #FFA300;
        font-size: 0.9rem;
        flex: 1;
    }
    button {
        background: #008751;
        color: #FFF1E8;
        border: none;
        border-radius: 4px;
        padding: 6px 16px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
    }
    button:hover { background: #00E436; color: #000; }

    textarea {
        width: 100%;
        height: 480px;
        background: #000;
        color: #00E436;
        border: 1px solid #5F574F;
        border-radius: 4px;
        padding: 14px;
        font-family: inherit;
        font-size: 0.8rem;
        resize: vertical;
        line-height: 1.5;
    }

    #error {
        color: #FF004D;
        margin-top: 16px;
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<h1>p8-to-js</h1>
<p>Convert a Pico-8 .p8 cart to a picoJS mapData / spriteFlags module.</p>

<div id="dropzone">
    Drop a <strong>.p8</strong> file here, or
    <label>browse<input type="file" accept=".p8" id="filePicker"></label>
</div>

<p id="error" hidden></p>

<div id="output-section" hidden>
    <div id="output-bar">
        <span id="output-name"></span>
        <button id="copyBtn">Copy</button>
        <button id="downloadBtn">Download</button>
    </div>
    <textarea id="output" readonly spellcheck="false"></textarea>
</div>

<script>
"use strict";

// ─── Parser functions (ported from p8-to-js.js, pure JS — no Node APIs) ──────

function splitSections(src) {
    const lines = src.split(/\r?\n/);
    const out = {};
    let cur = null;
    let buf = [];
    for (const line of lines) {
        const m = /^__([a-z]+)__\s*$/.exec(line);
        if (m) {
            if (cur !== null) out[cur] = buf.join("\n");
            cur = m[1];
            buf = [];
        } else if (cur !== null) {
            buf.push(line);
        }
    }
    if (cur !== null) out[cur] = buf.join("\n");
    return out;
}

function parseMap(body) {
    const rows = (body || "").split(/\r?\n/).filter(l => l.length > 0);
    const result = [];
    for (let y = 0; y < 32; y++) {
        const row = rows[y] || "";
        const tiles = new Array(128);
        for (let x = 0; x < 128; x++) {
            const hex = row.substr(x * 2, 2);
            tiles[x] = hex.length === 2 ? parseInt(hex, 16) : 0;
            if (isNaN(tiles[x])) tiles[x] = 0;
        }
        result.push(tiles);
    }
    return result;
}

function parseFlags(body) {
    const rows = (body || "").split(/\r?\n/).filter(l => l.length > 0);
    const flags = new Array(256).fill(0);
    for (let r = 0; r < 2; r++) {
        const row = rows[r] || "";
        for (let i = 0; i < 128; i++) {
            const hex = row.substr(i * 2, 2);
            const v = hex.length === 2 ? parseInt(hex, 16) : 0;
            flags[r * 128 + i] = isNaN(v) ? 0 : v;
        }
    }
    return flags;
}

function usedBounds(map) {
    let maxX = -1, maxY = -1;
    for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {
            if (map[y][x] !== 0) {
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
    }
    return { w: maxX + 1, h: maxY + 1 };
}

function emit(mapData, spriteFlags, opts) {
    opts = opts || {};
    const bounds = usedBounds(mapData);
    const header =
        "// Generated by p8-to-js\n" +
        "// Source: " + (opts.source || "(unknown)") + "\n" +
        "// Map: 128x32 (used: " + bounds.w + "x" + bounds.h + ")\n" +
        "// Sprite flags: 256 bytes\n" +
        "//\n" +
        "// Works as both a <script> include (sets globals) and a CommonJS\n" +
        "// module (module.exports). Pass to picoJS.run as:\n" +
        "//   picoJS.run({ mapData: mapData, spriteFlags: spriteFlags, ... })\n\n";

    const mapLines = mapData.map(row => "    [" + row.join(",") + "]");
    const mapBody = "var mapData = [\n" + mapLines.join(",\n") + "\n];\n\n";

    const flagChunks = [];
    for (let i = 0; i < spriteFlags.length; i += 16) {
        flagChunks.push("    " + spriteFlags.slice(i, i + 16)
            .map(v => "0x" + v.toString(16).padStart(2, "0")).join(", "));
    }
    const flagBody = "var spriteFlags = [\n" + flagChunks.join(",\n") + "\n];\n\n";

    const footer =
        "if (typeof module !== \"undefined\" && module.exports) {\n" +
        "    module.exports = { mapData: mapData, spriteFlags: spriteFlags };\n" +
        "}\n";

    return header + mapBody + flagBody + footer;
}

// ─── Browser UI ───────────────────────────────────────────────────────────────

const dropzone   = document.getElementById("dropzone");
const filePicker = document.getElementById("filePicker");
const outputSec  = document.getElementById("output-section");
const outputName = document.getElementById("output-name");
const outputArea = document.getElementById("output");
const errorEl    = document.getElementById("error");
const copyBtn    = document.getElementById("copyBtn");
const downloadBtn = document.getElementById("downloadBtn");

let currentOutputName = "output.js";
let currentBlob = null;

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
    outputSec.hidden = true;
}

function processFile(file) {
    errorEl.hidden = true;
    if (!file.name.endsWith(".p8")) {
        showError("Not a .p8 file: " + file.name);
        return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const src = e.target.result;
            const sections = splitSections(src);
            const map   = parseMap(sections.map || "");
            const flags = parseFlags(sections.gff || "");
            const js    = emit(map, flags, { source: file.name });

            currentOutputName = file.name.replace(/\.p8$/i, "") + "-mapdata.js";
            currentBlob = new Blob([js], { type: "text/javascript" });

            outputName.textContent = currentOutputName;
            outputArea.value = js;
            outputSec.hidden = false;
        } catch (err) {
            showError("Parse error: " + err.message);
        }
    };
    reader.onerror = () => showError("Could not read file.");
    reader.readAsText(file);
}

// File picker
filePicker.addEventListener("change", () => {
    if (filePicker.files[0]) processFile(filePicker.files[0]);
});

// Drag and drop
dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("over");
});
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("over");
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
});

// Copy button
copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(outputArea.value).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = orig, 1500);
    });
});

// Download button
downloadBtn.addEventListener("click", () => {
    if (!currentBlob) return;
    const url = URL.createObjectURL(currentBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = currentOutputName;
    a.click();
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
